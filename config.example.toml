# cc-qq-gateway configuration
# Copy to config.toml and fill in your own values. Do not commit config.toml.

[qq]
app_id = "YOUR_APP_ID"
client_secret = "YOUR_APP_SECRET"
sandbox = false

# Single-chat/private QQ messages use GROUP_AND_C2C_EVENT.
# Leave empty to use the same default.
intents = ["GROUP_AND_C2C_EVENT"]

[codex]
binary = "codex"

# Codex working directory. Empty uses the gateway process working directory.
work_dir = ""

# Optional Codex CLI defaults. Empty uses Codex's own config/default.
model = ""
effort = ""

# Non-interactive permission handling.
# One of: default | plan | acceptEdits | bypassPermissions
permission_mode = "bypassPermissions"
sandbox = "read-only"
approval_policy = "never"
dangerously_skip_permissions = true

# Native Codex web search.
web_search = true

# Extra Codex CLI access/flags.
add_dirs = ["/"]
extra_args = []

# Optional prompt prefix. Leave empty for strict QQ text -> Codex prompt behavior.
append_system_prompt = ""

# Max runtime for one Codex turn.
timeout_seconds = 7200

[gateway]
# Split long replies into chunks of at most this many runes.
max_reply_chars = 1800

# Try QQ native markdown first. The gateway falls back to plain text if QQ rejects it.
reply_as_markdown = false

# Optional C2C open_id allowlist. Empty allows any private user.
allowed_users = []

# Persist thread ids, msg_seq and queued replies. Use "none" to disable.
state_path = ""

# Local storage for inbound QQ images/files/videos before their paths are sent to Codex.
# Empty defaults to ~/.cc-qq/attachments.
attachment_dir = ""

# Max bytes per inbound attachment. Default is 512 MiB.
attachment_max_bytes = 536870912
